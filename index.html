/* 시계: 보는 사람의 시간대와 상관없이 항상 한국 시간으로 표시 */
const phoneNow=()=>new Date(Date.parse(C.now)+(Date.now()-t0));
const nowStr=()=>phoneNow().toLocaleTimeString('ko-KR',{...KST,hour:'numeric',minute:'2-digit',hour12:true});
const md=d=>new Intl.DateTimeFormat('en-US',{...KST,month:'numeric',day:'numeric'}).format(d);
/* 일정이 해당 날짜(연/월/일)에 걸리는지 — 일정에 y 를 안 적으면 2026년만 해당 */
const cov=(e,y,m,d)=>{if(y!==(e.y||2026))return false;const k=m*100+d;return k>=e.m*100+e.d&&k<=(e.em||e.m)*100+(e.ed||e.d)};
/* 일정 점 색: 직접 지정(c) > '데이트' 포함이면 초록 > 파랑 */
const evc=e=>e.c||(/데이트/.test(e.t)?'grn':'blu');

/* 도시별 현지 시각(벽시계)을 숫자로 — 세계 시각 계산용 */
const wall=(d,tz)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(d).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute)};
function memoDate(w){
  const b=phoneNow(),[mm,dd]=md(b).split('/').map(Number),yy=+C.now.slice(0,4);
  if(w.d!=null){const [m2,d2]=md(new Date(b-w.d*864e5)).split('/');return `${m2}월 ${d2}일`}
  if(w.md)return `${w.md[0]}월 ${w.md[1]}일`;
  return `${yy-w.y}년 ${mm}월 ${dd}일`;
}
function tick(){
  const d=phoneNow();
  const tm=d.toLocaleTimeString('ko-KR',{...KST,hour:'2-digit',minute:'2-digit',hour12:false});
  const dt=d.toLocaleDateString('ko-KR',{...KST,month:'long',day:'numeric',weekday:'long'});
  document.querySelectorAll('.t-time').forEach(e=>e.textContent=tm);
  document.querySelectorAll('.t-date').forEach(e=>e.textContent=dt);
}
setInterval(()=>openId&&tick(),10000);
/* 통화 대사: 한 줄씩만 표시 (새 줄이 나오면 이전 줄은 사라짐). 이름이 위, 내용이 아래 두 줄
   간격(gap)·자동 종료 시간(endDelay)은 C.callCfg 에서 조절 */
const callLine=c=>`<p><span class="cwho">${esc(c.who)}</span><span>${esc(c.lines[c.shown-1])}</span></p>`;
function callStart(){
  const c=S.call,mine=S,cfg=C.callCfg||{},gap=cfg.gap||3000,endDelay=cfg.endDelay==null?2000:cfg.endDelay;clearTimeout(S.cl);
  const next=d=>{S.cl=setTimeout(()=>{
    if(S!==mine||S.call!==c||c.end)return;
    c.shown++;const m=document.querySelector('.cmsg');
    if(m)m.innerHTML=callLine(c);
    if(c.shown<c.lines.length)next(gap);
    else S.cl=setTimeout(()=>{if(S!==mine||S.call!==c||c.end)return;ACT.callend();draw()},endDelay)},d)};   // 대사가 모두 끝나면 자동으로 통화 종료
  next(1500);
}
function callTimer(){clearInterval(S.ci);S.ci=setInterval(()=>{const e=$('.t-call');if(e&&S.call&&!S.call.end)e.textContent=callFmt()},1000)}
const callFmt=()=>{const s=Math.max(0,Math.floor((Date.now()-S.call.st)/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
/* 발신 통화 시작 (최근 통화 / 카톡 프로필 보이스톡 공용) */
function dialOut(name,from,lines){
  const sc=lines||C.callScripts[name];if(!sc){toast('통화를 연결할 수 없습니다');return false}
  if(from==='phone')S.calls.unshift([name,'out',0,nowStr()]);   // 전화 앱에서 건 통화는 최근기록에 '발신 전화'로 남음
  S.callFrom=from;const c=S.call={dir:'out',name,who:name,on:0,lines:sc,shown:0},mine=S;S.screen='call';
  S.co=setTimeout(()=>{if(S!==mine||S.call!==c||c.end)return;c.on=1;c.st=Date.now();draw();callTimer();callStart()},2200);
}

 pin:()=>`<section class="screen pin"><div class="pin-head"><div class="locktime t-time"></div><div class="pin-title">PIN 번호를 입력하세요</div><div class="dots">${[0,1,2,3,4,5].map(i=>`<i class="dot${i<S.pin.length?' on':''}"></i>`).join('')}</div><div class="pin-error">${S.err}</div></div><div class="numpad">${[1,2,3,4,5,6,7,8,9,'b',0,'o'].map(n=>n==='b'?'<button class="num" data-a="bksp" aria-label="지우기">⌫</button>':n==='o'?'<button class="num ok" data-a="submit">확인</button>':`<button class="num" data-a="key" data-n="${n}">${n}</button>`).join('')}</div></section>`,
 home:()=>`<section class="screen home"><div class="wx"><svg width="34" height="34" viewBox="0 0 30 30"><circle cx="15" cy="15" r="6" fill="#ffd54a"/><path d="M15 3v3M15 24v3M3 15h3M24 15h3M6.5 6.5l2 2M21.5 21.5l2 2M6.5 23.5l2-2M21.5 8.5l2-2" stroke="#ffd54a" stroke-width="2" stroke-linecap="round"/></svg><b>36°</b><span>맑음</span></div><div class="music"><div class="art">♪</div><div class="t"><b>${esc(C.playlist[S.tr].title)}</b><span>${esc(C.playlist[S.tr].artist)}</span></div><div class="ctl"><button data-a="prev" aria-label="이전 곡">${svg(PI.prev,'#fff',22)}</button><button data-a="play" aria-label="${S.play?'일시정지':'재생'}">${svg(S.play?PI.pause:PI.play,'#fff',28)}</button><button data-a="next" aria-label="다음 곡">${svg(PI.next,'#fff',22)}</button></div><div class="pg"><i style="width:${S.prog}%"></i></div></div><div class="row2"><button class="dd" data-a="open" data-app="dday" aria-label="디데이"><span>${esc(C.dday.icon)}</span><b>${esc(C.dday.text)}</b></button><button class="memow" data-a="open" data-app="memo"><div class="mh">메모</div>${S.memos.slice(0,3).map(m=>`<div class="mr"><span>${esc(m.title||'제목 없음')}</span><small>${m.d}</small></div>`).join('')}</button></div><div class="appgrid" style="margin-top:20px">${GRID.map(id=>appBtn(id)).join('')}</div><div class="dock">${DOCK.map(id=>appBtn(id,false)).join('')}</div></section>`,
 dday:()=>`<section class="screen ddapp">${bar('디데이')}<div class="content">${C.ddays.map(x=>`<div class="ddi"><span class="t">${esc(x.t)}</span><span class="d${x.fut?' fut':''}">${esc(x.d)}</span></div>`).join('')}</div></section>`,
 calendar:()=>{
  const first=new Date(S.y,S.m,1).getDay(),sel=S.sel.join('-');
  const cells=Array.from({length:42},(_,i)=>{const d=new Date(S.y,S.m,1-first+i),y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
    const cls=[m!==S.m?'mutedday':'',`${y}-${m}-${n}`===sel?'chosen':''].join(' ');
    const cs=CORD.filter(c=>C.events.some(e=>cov(e,y,m+1,n)&&evc(e)===c));
    return `<button class="${cls}" data-a="day" data-y="${y}" data-m="${m}" data-d="${n}">${n}${cs.length?`<span class="dts">${cs.map(c=>`<i class="${c}"></i>`).join('')}</span>`:''}</button>`}).join('');
  const ev=C.events.filter(e=>cov(e,+S.sel[0],+S.sel[1]+1,+S.sel[2])),wd=new Date(S.sel[0],S.sel[1],S.sel[2]).getDay();
  const eg=C.egg,photo=S.cphoto?`<div class="cph"><button class="cph-x" data-a="cphx" aria-label="창 닫기">${KPI.x}</button><img src="${esc(eg.img)}" alt=""><div class="cph-cap">${esc(eg.cap)}</div></div>`:'';
  return `<section class="screen">${bar('캘린더')}<div class="content"><div class="calendar-head"><button data-a="cal" data-v="-1" aria-label="이전 달">‹</button><strong>${S.y}년 ${S.m+1}월</strong><button data-a="cal" data-v="1" aria-label="다음 달">›</button></div><div class="week">${'일월화수목금토'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div><div class="agenda"><div class="dayh"><small style="color:${['#e8453c','#777','#777','#777','#777','#777','#3578d4'][wd]}">${'일월화수목금토'[wd]}요일</small><b>${S.sel[2]}</b></div><div class="evs">${ev.length?ev.map(e=>`<div class="card"><div class="sub" style="margin:0 0 6px">${e.m}월 ${e.d}일${e.em?` ~ ${e.em}월 ${e.ed}일`:''}</div><b>${esc(e.t)}</b><div class="sub">${esc(e.s)}</div></div>`).join(''):'<div class="muted" style="font-size:13px;padding:14px 0">등록된 일정이 없습니다.</div>'}</div></div></div>${photo}</section>`},
 internet:()=>`<section class="screen"><div class="topbar"><button class="back" data-a="back" aria-label="뒤로">‹</button><strong style="color:#03c75a">NAVER</strong><button data-a="toast" data-t="메뉴">☰</button></div><div class="content"><div style="text-align:center;font-size:36px;font-weight:800;color:#03c75a;margin:12px 0 25px;letter-spacing:-2px">NAVER</div><form class="searchbox" data-form="search"><span>⌕</span><input name="q" value="${esc(S.q)}" placeholder="검색어를 입력해 주세요" autocomplete="off"><button type="submit" aria-label="검색">⌕</button></form><div class="history-title">최근 검색어</div>${C.searches.map(s=>`<div class="history-item"><span class="muted">⌕</span><button class="q" data-a="search" data-q="${esc(s)}">${esc(s)}</button><button class="x" data-a="toast" data-t="검색어 삭제는 지원하지 않습니다" aria-label="삭제">×</button></div>`).join('')}${S.q?`<div class="card"><b style="color:#03c75a">NAVER</b><div style="font-size:16px;margin:10px 0">${esc(S.q)}</div><div class="sub">통합검색 · 블로그 · 이미지 · 카페 · 지식iN</div></div>`:''}</div></section>`,
 instagram:()=>{
  if(S.ig==='dmchat'){
   const id=C.dms[S.dmi][0],av=dav(id,S.dmi),th=C.threads[id],last=th[th.length-1];
   return `<section class="screen ig"><div class="topbar"><button class="back" data-a="back" aria-label="뒤로">‹</button><div class="avatar" style="width:30px;height:30px;font-size:14px">${av}</div><strong style="font-size:15px">${esc(id)}</strong>${IGI.callb}${IGI.videob}</div><div class="content" style="padding:6px 14px 14px;bottom:62px">${th.map(x=>dmItem(x,av)).join('')}${last.w==='me'?'<div class="dmread">읽음</div>':''}</div><div class="dmin"><span>📷</span><span>메시지 입력...</span></div></section>`}
  if(S.ig==='post'){
   return `<section class="screen ig"><div class="topbar"><button class="back" data-a="back" aria-label="뒤로">‹</button><strong style="font-size:17px">게시물</strong><button data-a="toast" data-t="메뉴" aria-label="메뉴">⋯</button></div><div class="content" style="padding-top:7px;bottom:52px">${postHTML(S.pv.p,S.pv.key)}</div>${igbar()}</section>`}
  if(S.ig==='uprofile'){
   const p=C.profiles[S.pu],di=C.dms.findIndex(x=>x[0]===S.pu&&C.threads[x[0]]);
   return `<section class="screen ig"><div class="topbar"><button class="back" data-a="back" aria-label="뒤로">‹</button><strong style="font-size:17px">${esc(S.pu)}</strong><button data-a="toast" data-t="메뉴" aria-label="메뉴">⋯</button></div><div class="content" style="padding-top:7px;bottom:52px"><div class="profiletop"><div class="profilephoto">${pic(p.av)}</div><div class="stats"><div><b>${p.posts}</b><span>게시물</span></div><div><b>${p.followers-(S.fol?0:1)}</b><span>팔로워</span></div><div><b>${p.following}</b><span>팔로잉</span></div></div></div><div class="profilebio"><b>${esc(p.name)}</b></div><div class="profilebuttons"><button class="fbtn ${S.fol?'fing':'fnew'}" data-a="fol">${S.fol?'팔로잉 ⌄':'팔로우'}</button><button data-a="${di<0?'toast':'dmopen'}" data-i="${di}" data-t="메시지를 보낼 수 없습니다">메시지</button></div><div class="iggrid">${p.list.map((x,j)=>`<div data-a="ppost" data-s="u" data-j="${j}">${pic(x.e)}</div>`).join('')}</div></div>${S.sheet?sheet():''}${igbar()}</section>`}
  return `<section class="screen ig"><div class="topbar"><button class="back" data-a="back" aria-label="뒤로">‹</button><strong class="iglogo">Instagram</strong><button style="font-size:23px" data-a="toast" data-t="새 게시물">＋</button><button data-a="ig" data-p="dm" aria-label="메시지">${IGI.dm}</button></div><div class="content" style="padding-top:7px;bottom:52px">${IG[S.ig]()}</div>${igbar()}</section>`},
 phone:()=>{
  const tabs=[['recent','최근기록'],['contacts','연락처'],['keypad','키패드']];
  const base=phoneNow();
  const body=S.tab==='recent'?`<div style="font-size:12px;color:#777;margin:14px 0">최근 2주</div>${S.calls.map(c=>`<button class="callrow" data-a="callrow" data-n="${esc(c[0])}"><div class="callavatar">👤</div><div class="callinfo"><strong>${esc(c[0])}</strong><small>${{miss:'부재중 전화',out:'발신 전화',in:'수신 전화'}[c[1]]} · ${c[3]}</small></div><div class="callmeta"><span>${md(new Date(base-c[2]*864e5))}</span><b class="${c[1]==='miss'?'miss':''}">${c[1]==='out'?'↗':'↙'}</b></div></button>`).join('')}`
  :S.tab==='contacts'?'<div class="muted" style="padding:25px 0">연락처가 없습니다.</div>'
  :`<div class="dial-display">${S.dial?esc(S.dial):'<span class="muted" style="font-size:14px">번호 입력</span>'}</div><div class="keypad">${'123456789*0#'.split('').map(n=>`<button class="keynum" data-a="dial" data-n="${n}">${n}<small>${ABC[n]||''}</small></button>`).join('')}</div><div class="dial-actions"><button data-a="dialbk" style="font-size:21px" aria-label="지우기">⌫</button><button class="dial-call" data-a="dialcall" aria-label="통화">☎</button><button data-a="dialclr" style="font-size:20px" aria-label="모두 지우기">×</button></div>`;
  return `<section class="screen">${bar('전화')}<div class="content" style="padding-top:0"><div class="calltabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-t="${k}">${l}</button>`).join('')}</div>${body}</div></section>`},
 messages:()=>simple('메시지',C.sms.map((s,i)=>`<button class="msgrow" style="${s.body||s.msgs?'':'opacity:.78'}" data-a="${s.body||s.msgs?'chat':'toast'}" data-i="${i}" data-t="이 대화는 열 수 없습니다"><div class="avatar">${pic(s.i)}</div><div class="t"><strong>${esc(s.n)}</strong><p>${esc(s.p)}</p></div><span class="stamp">${s.t}</span></button>`).join('')),
 chat:()=>{const s=C.sms[S.chat],ms=s.msgs||[['them',s.body]];return `<section class="screen">${bar(esc(s.n))}<div class="content" style="bottom:60px"><div style="text-align:center;color:#999;font-size:11px;margin:10px 0">${ms.some(m=>m[0]==='sep')?'':esc(s.dl||'오늘')}</div>${ms.map(([w,t])=>w==='sep'?`<div style="text-align:center;color:#999;font-size:11px;margin:14px 0 8px">${esc(t)}</div>`:`<div class="bubble${w==='me'?' me':''}">${esc(t)}</div>`).join('')}</div><div class="chatinput">메시지 입력 · 데모에서는 답장을 보낼 수 없습니다</div></section>`},
 kakao:()=>`<section class="screen kk"><div class="ktop"><button class="back" data-a="back" aria-label="뒤로">‹</button><strong>채팅</strong>${KTI}</div><div class="content" style="bottom:56px;padding-top:6px">${S.k.map((k,i)=>`<button class="kc" data-a="${k.msgs?'kchat':'toast'}" data-i="${i}" data-t="대화방을 열 수 없습니다"><div class="kav">${pic(k.e)}</div><div class="t"><strong>${esc(k.n)}</strong><p>${esc(k.p)}</p></div><div class="m"><span>${k.t}</span>${k.u?`<span class="badge">${k.u}</span>`:''}</div></button>`).join('')}</div>${kbar()}</section>`,
 kchat:()=>{const k=S.k[S.chat],nx=k.rp&&k.rp[0];
  const inp=nx?`<div class="kfield">${esc(nx)}</div><button class="ksend" data-a="ksend">전송</button>`
   :k.free?`<input class="kfield" id="kin" placeholder="메시지 입력" autocomplete="off" aria-label="메시지 입력"><button class="ksend" data-a="kfree">전송</button>`
   :`<div class="kfield ph">메시지 입력</div><button class="ksend" disabled>전송</button>`;
  return `<section class="screen kroom">${bar(esc(k.n),{st:'background:#b2c7da'})}<div class="content" style="bottom:56px">${kmsgs(k)}</div><div class="kin">${inp}</div></section>`},
 /* 카카오톡 프로필 화면: 상대방 프로필 사진을 누르면 열림 */
 kprofile:()=>{const k=S.k[S.chat],im=isImg(k.e);
  return `<section class="screen kpro">${im?`<img class="kpbg" src="${esc(k.e)}" alt="">`:''}<div class="kpshade"></div><div class="kptop"><button data-a="back" aria-label="닫기">${KPI.x}</button><div class="r"><button data-a="toast" data-t="선물하기" aria-label="선물하기">${KPI.gift}</button><button data-a="toast" data-t="즐겨찾기" aria-label="즐겨찾기">${KPI.star}</button><button data-a="toast" data-t="설정" aria-label="설정">${svg(P.gear,'#fff',23)}</button></div></div><div class="kpmid"><div class="kpph">${pic(k.e)}</div><div class="kpname">${esc(k.n)}</div>${k.st?`<div class="kpst">${esc(k.st)}</div>`:''}</div><div class="kpact"><button data-a="kpchat"><i>${KPI.chat}</i>1:1 채팅</button><button data-a="kpcall"><i>${KPI.call}</i>보이스톡</button><button data-a="toast" data-t="페이스톡을 연결할 수 없습니다"><i>${KPI.video}</i>페이스톡</button></div></section>`},
 /* 통화 화면 (삼성 갤럭시 스타일): 수신 / 발신 / 통화 중 / 종료 */
 call:()=>{const c=S.call,pm=svg(P.phone,'#fff',30),end=`<span style="display:inline-flex;transform:rotate(135deg)">${pm}</span>`;
  const dots=[6,12,18].flatMap(y=>[6,12,18].map(x=>`<circle cx="${x}" cy="${y}" r="1.7" fill="currentColor"/>`)).join('');
  const head=sub=>`<div class="cn"${c.on?' style="font-size:26px"':''}>${esc(c.name)}</div><div class="cs${c.on&&!c.end?' t-call':''}">${sub}</div>`;
  if(c.end)return `<section class="screen call">${head('통화 종료됨.')}<div class="cav">👤</div></section>`;
  if(!c.on){const inn=c.dir==='in';return `<section class="screen call">${head(inn?'휴대전화 · 수신 전화':'발신 중...')}<div class="cav">👤</div><div class="cbtns"${inn?'':' style="justify-content:center"'}><button class="cbt red" data-a="callend"><i>${end}</i>${inn?'거절':'종료'}</button>${inn?`<button class="cbt grn" data-a="callacc"><i>${pm}</i>수락</button>`:''}</div></section>`}
  return `<section class="screen call">${head(callFmt())}<div class="cmid"><div class="cmsg">${c.shown?callLine(c):''}</div></div><div class="cbot"><div class="crow"><button class="cbt sm${c.sp?' on':''}" data-a="ctog" data-k="sp" aria-pressed="${c.sp?'true':'false'}"><i>${svg(P.vol,'currentColor',26)}</i>스피커</button><button class="cbt sm${c.mu?' on':''}" data-a="ctog" data-k="mu" aria-pressed="${c.mu?'true':'false'}"><i><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></i>음소거</button><button class="cbt sm${c.kp?' on':''}" data-a="ctog" data-k="kp" aria-pressed="${c.kp?'true':'false'}"><i><svg width="24" height="24" viewBox="0 0 24 24">${dots}</svg></i>키패드</button></div><button class="cbt red" data-a="callend"><i>${end}</i>종료</button></div></section>`},
 memo:()=>`<section class="screen memo">${bar('메모')}<div class="content">${S.memos.map((m,i)=>{const dn=m.items.filter(x=>x.c).length;return `<button class="mcard" data-a="medit" data-i="${i}"><b>${esc(m.title||'제목 없음')}</b><p>${esc(m.items.map(x=>x.t).join(' '))}</p><small>${m.d}${m.items.length?` · ${dn}/${m.items.length} 완료`:''}</small></button>`}).join('')}</div></section>`,
 memoedit:()=>{const m=S.memos[S.mi];return `<section class="screen memo">${bar(esc(m.d))}<div class="content" style="padding:6px 18px 24px"><input class="mtitle" data-mt="${S.mi}" value="${esc(m.title)}" placeholder="제목" autocomplete="off">${m.items.map((it,j)=>`<div class="mi${it.c?' done':''}"><button class="cb" data-a="mchk" data-j="${j}" aria-label="완료 표시" aria-pressed="${it.c?'true':'false'}">${it.c?'✓':''}</button><input class="mit" data-mi="${j}" value="${esc(it.t)}" placeholder="내용" autocomplete="off"></div>`).join('')}<button class="madd" data-a="madd">＋ 항목 추가</button></div></section>`},
 melon:()=>`<section class="screen melon">${bar('Melon',{st:'background:#00cd3c;color:#fff'})}<div class="content"><div class="melon-head">음악이 필요한 순간, 멜론</div><div class="melon-card"><strong>멜론 TOP100</strong><div class="muted" style="font-size:12px;margin-top:5px">지금 가장 많이 듣는 음악</div>${C.songs.map(s=>`<div class="song"><div class="album">♪</div><span><b>${esc(s[0])}</b><br><small class="muted">${esc(s[1])}</small></span><button data-a="toast" data-t="재생 중: ${esc(s[0])}" aria-label="재생">▶</button></div>`).join('')}</div></div></section>`,
 clock:()=>{
  const tabs=[['alarm','알람','⏰'],['world','세계 시각','🌐'],['sw','스톱워치','⏱'],['tm','타이머','⏳']];
  let body;
  if(S.ct==='world'){
   const b=phoneNow(),ws=wall(b,'Asia/Seoul');
   body=`<div class="history-title" style="margin-top:6px">세계 시각</div>`+WORLD.map(([n,tz])=>{
    const w=wall(b,tz),df=Math.round((w-ws)/36e5),dd=Math.floor(w/864e5)-Math.floor(ws/864e5);
    return `<div class="card wl"><div><b>${n}</b><div class="sub">${['어제','오늘','내일'][dd+1]||'오늘'}, ${df>=0?'+':''}${df}시간</div></div><span class="wt">${b.toLocaleTimeString('ko-KR',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true})}</span></div>`}).join('');
  }else body=`<div class="history-title" style="margin-top:6px">알람</div>`+S.al.map((a,i)=>`<div class="card al${a.on?'':' off'}"><div><b>${a.t.replace(/^(오전|오후)\s*(.*)$/,'<small style="font-size:13px">$1</small> $2')}</b><div class="sub">매일</div></div><button class="sw${a.on?' on':''}" data-a="altog" data-i="${i}" role="switch" aria-checked="${a.on?'true':'false'}" aria-label="알람 ${a.t}"></button></div>`).join('');
  return `<section class="screen">${bar('시계')}<div class="content" style="bottom:54px">${body}</div><div class="bottomnav">${tabs.map(([k,l,s])=>`<button class="${S.ct===k?'selected':''}" ${k==='alarm'||k==='world'?`data-a="ctab" data-t="${k}"`:'data-a="toast" data-t="지원하지 않는 기능입니다"'}><span class="sym">${s}</span>${l}</button>`).join('')}</div></section>`},
 gallery:()=>{
  if(S.gal!=null){const f=C.gallery[S.gal];return simple(esc(f.n),`<div class="iggrid" style="margin-top:0">${f.e.map(x=>`<div>${pic(x)}</div>`).join('')}</div><div class="muted" style="text-align:center;font-size:12px;margin-top:14px">${f.c}개 항목</div>`)}
  return simple('앨범',`<div class="fgrid">${C.gallery.map((f,i)=>`<button class="fol" data-a="gal" data-i="${i}"><div class="cv" style="background:${GR[i%3]}">${pic(f.e[0])}</div><b>${esc(f.n)}</b><small>${f.c}</small></button>`).join('')}</div>`)},
 youtube:()=>simple('YouTube','<div class="card">▶ 추천 동영상</div><div class="card">🎬 오늘의 인기 영상</div>')
};

/* ===== 동작 ===== */
const phone=$('#phone');
function draw(){
  const s=S.screen;
  phone.classList.toggle('fs',s==='lock'||s==='pin'||s==='call');
  phone.classList.toggle('ov',s==='home');
  phone.classList.toggle('lt',['lock','pin','home','melon','call','kprofile'].includes(s)||(s==='calendar'&&S.cphoto));
  $('#screens').innerHTML=V[s]();tick();
  if(s==='kchat'||(s==='instagram'&&S.ig==='dmchat')){const c=document.querySelector('#screens .content');c.scrollTop=c.scrollHeight}
  if(s==='kchat'&&S.fk){const i=$('#kin');if(i)i.focus();S.fk=0}
  if(s==='memoedit'&&S.focus!=null){const i=document.querySelector(`.mit[data-mi="${S.focus}"]`);if(i)i.focus();S.focus=null}
}
function hideNote(){const e=$('#note');e.className='note';e.innerHTML=''}
/* 카톡 상단 알림 배너 (i = 채팅방 번호). 누르면 해당 채팅방으로 이동, 안 누르면 3초 뒤 사라짐 */
function banner(i,txt){
  const k=S.k[i],e=$('#note');S.note=i;
  e.className='note show';
  e.innerHTML=`<div class="h"><span class="ni">${svg('M12 4C7.6 4 4 6.9 4 10.5c0 2.3 1.5 4.3 3.7 5.5l-.8 3 3.4-2c.5.1 1.1.1 1.7.1 4.4 0 8-2.9 8-6.6S16.4 4 12 4z','#3a1d1d',12)}</span>카카오톡 · 지금<button data-a="ndis" aria-label="알림 닫기">✕</button></div><b>${esc(k.n)}</b><p>${esc(isImg(txt)?'사진을 보냈습니다.':txt)}</p>`;
  clearTimeout(S.hn);S.hn=setTimeout(hideNote,3000);
}
function notify(n){
  const i=S.k.findIndex(k=>k.n===n.from);if(i<0)return;
  const tm=nowStr();
  const k=S.k[i];n.texts.forEach(t=>k.msgs.push(['them',t,tm]));
  k.p=n.texts[n.texts.length-1];k.t=tm;k.rp=[...n.reply];k.an=n.answer;
  if(S.screen==='kchat'&&S.chat===i){k.u=0;draw();return}   // 이미 그 채팅방을 보고 있으면 알림 없이 바로 표시
  k.u=(k.u||0)+n.texts.length;
  banner(i,n.texts.join('\n'));
  if(S.screen==='kakao')draw();
}
/* 상대방(카톡)이 말을 보냄 — free=true 면 이후부터 내가 직접 입력할 수 있음
   그 채팅방 화면을 보고 있지 않으면 상단 알림으로 표시 */
function botSay(k,w,free){
  const a=nowStr(),i=S.k.indexOf(k);k.msgs.push(['them',w,a]);k.p=w;k.t=a;if(free)k.free=1;
  if(S.screen==='kchat'&&S.chat===i){S.fk=1;draw();return}
  k.u=(k.u||0)+1;banner(i,w);
  if(S.screen==='kakao')draw();
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.id);toast.id=setTimeout(()=>e.style.display='none',1800)}
/* ACT 함수가 false 를 반환하면 화면 전체를 다시 그리지 않습니다 (스크롤 유지용) */
const ACT={
 pinscreen(){S.screen='pin'},
 key(d){if(S.pin.length<6){S.pin+=d.n;S.err=S.pin.length===6?'확인을 눌러 잠금을 해제하세요':DEF}},
 bksp(){S.pin=S.pin.slice(0,-1)},
 clr(){S.pin='';S.err=DEF},
 submit(){if(S.pin===C.pin){S.pin='';S.err=DEF;if(S.pend!=null){S.chat=S.pend;S.pend=null;S.screen='kchat'}else S.screen='home'}else{S.pin='';S.err='PIN 번호가 올바르지 않습니다'}},
 home(){if(S.screen!=='lock'&&S.screen!=='pin'&&S.screen!=='call')S.screen='home'},
 open(d){if(NOOP.includes(d.app))return;S.screen=d.app;if(d.app==='instagram')S.ig='home';if(d.app==='gallery')S.gal=null},
 cal(d){const x=new Date(S.y,S.m+ +d.v,1);S.y=x.getFullYear();S.m=x.getMonth()},
 /* 날짜 클릭. 숨은 날짜(C.egg)를 연속으로 3번 누르면 사진이 뜸 */
 day(d){const y=+d.y,m=+d.m,n=+d.d,g=C.egg,hit=g&&y===g.y&&m===g.m-1&&n===g.d,same=S.sel[0]===y&&S.sel[1]===m&&S.sel[2]===n;
  S.y=y;S.m=m;S.sel=[y,m,n];
  S.egg=hit?(same?(S.egg||1)+1:1):0;
  if(S.egg>=3){S.cphoto=1;S.egg=0}},
 cphx(){S.cphoto=0;S.egg=0},
 search(d){S.q=d.q},
 ig(d){S.ig=d.p},
 /* 인스타 아이디 클릭 → 해당 계정 (내 계정 = 프로필 탭, 그 외 = 상대 프로필) */
 acct(d){const u=d.u;
  if(u===C.ig.id)S.ig='profile';
  else if(C.profiles[u]){S.pu=u;S.sheet=0;S.ig='uprofile'}
  else{toast('계정을 열 수 없습니다');return false}},
 /* 인스타 좋아요 / 저장 / 더 보기 */
 like(d,el){const on=el.classList.toggle('liked');S.lk[d.i]=on;el.closest('.post').querySelector('.lk-n').textContent=`좋아요 ${num(+d.l+(on?1:0)-(S.pre[d.i]?1:0))}개`;return false},
 save(d,el){const on=el.classList.toggle('saved');S.sv[d.i]=on;if(on)toast('저장되었습니다');return false},
 more(d,el){el.previousElementSibling.classList.remove('clamp');el.remove();return false},
 dmopen(d){S.dmi=+d.i;S.ig='dmchat'},
 uprof(d){S.pu=d.u;S.sheet=0;S.ig='uprofile'},
 /* 프로필 게시물 → 게시물 화면 (s=o: 내 프로필 / s=u: 다른 사람 프로필) */
 ppost(d){const x=(d.s==='o'?C.ig.grid:C.profiles[S.pu].list)[+d.j],p=x.ref!=null?C.posts[x.ref]:x.post;S.pv={p,key:x.ref!=null?x.ref:d.s+(S.pu||'')+d.j};S.pback=S.ig;S.ig='post'},
 tab(d){if(d.t!=='contacts')S.tab=d.t},
 dial(d){if(S.dial.length<15)S.dial+=d.n},
 dialbk(){S.dial=S.dial.slice(0,-1)},
 dialclr(){S.dial=''},
 chat(d){S.chat=+d.i;S.screen='chat'},
 kchat(d){S.chat=+d.i;S.k[S.chat].u=0;S.screen='kchat'},
 /* 카톡 대화창 상대 프로필 → 프로필 화면 / 1:1 채팅 / 보이스톡 */
 kprof(){S.screen='kprofile'},
 kpchat(){S.screen='kchat'},
 kpcall(){return dialOut(S.k[S.chat].n,'kprofile')},
 /* 갤러리 / 시계 */
 gal(d){S.gal=+d.i},
 ctab(d){S.ct=d.t},
 altog(d,el){const a=S.al[+d.i];a.on=!a.on;el.classList.toggle('on',a.on);el.setAttribute('aria-checked',a.on?'true':'false');el.closest('.card').classList.toggle('off',!a.on);return false},
 /* 메모 */
 medit(d){S.mi=+d.i;S.screen='memoedit'},
 mchk(d,el){const it=S.memos[S.mi].items[+d.j];it.c=it.c?0:1;el.closest('.mi').classList.toggle('done',!!it.c);el.textContent=it.c?'✓':'';el.setAttribute('aria-pressed',it.c?'true':'false');return false},
 madd(){const m=S.memos[S.mi];m.items.push({t:'',c:0});S.focus=m.items.length-1},
 /* 카톡: 정해진 답장 2개 → 상대가 '웅' → 이후 자유 입력 */
 ksend(){const k=S.k[S.chat];if(!k.rp||!k.rp.length)return;
  const t=k.rp.shift(),tm=nowStr();k.msgs.push(['me',t,tm]);k.p=t;k.t=tm;
  if(!k.rp.length){const mine=S;[].concat(k.an).forEach((x,i)=>setTimeout(()=>{if(S===mine)botSay(k,x,1)},1200+i*1100))}},   // 답장이 여러 줄이면 한 줄씩
 /* 자유 입력: 방마다 트리거가 다름. 너구리 방(k.trg) = 결혼/프로포즈, 재현이 방 = C.triggers + 전화 수신 */
 kfree(){const k=S.k[S.chat],i=$('#kin');if(!k.free||!i)return false;
  const t=i.value.trim();if(!t)return false;
  const tm=nowStr(),mine=S;let wait=900;
  k.msgs.push(['me',t,tm]);k.p=t;k.t=tm;S.fk=1;
  /* 트리거: 맞는 단어가 있으면 상대가 한 줄씩(약 1초 간격) 답장 — 채팅방을 벗어나 있으면 상단 알림으로 표시 */
  (k.trg||C.triggers).forEach(g=>{if(new RegExp(g.re).test(t))g.say.forEach(x=>{setTimeout(()=>{if(S===mine)botSay(k,x)},wait);wait+=1100})});
  if(!k.trg&&new RegExp(C.callRe).test(t))setTimeout(()=>{if(S===mine&&S.screen!=='lock'&&S.screen!=='pin'&&!S.call){const n=C.incoming;S.callFrom=S.screen;S.call={dir:'in',name:n.who,who:n.who,on:0,lines:n.lines,shown:0};S.screen='call';draw()}},wait+300)},
 callrow(d){return dialOut(d.n,'phone')},
 /* 키패드: 입력한 번호에 대사(C.dialScripts)가 있으면 발신 통화 */
 dialcall(){const s=(C.dialScripts||{})[S.dial];
  if(!s){toast(S.dial?'통화를 연결할 수 없습니다':'번호를 입력하세요');return false}
  S.dial='';return dialOut(s.name,'phone',s.lines)},
 /* 통화 중 스피커 / 음소거 / 키패드: 누르면 흰색으로 켜짐 */
 ctog(d,el){const c=S.call;if(!c||c.end)return false;c[d.k]=!c[d.k];el.classList.toggle('on',!!c[d.k]);el.setAttribute('aria-pressed',c[d.k]?'true':'false');return false},
 callacc(){const c=S.call;c.on=1;c.st=Date.now();callTimer();callStart()},
 callend(){const c=S.call;if(!c||c.end)return false;
  clearInterval(S.ci);clearTimeout(S.cl);clearTimeout(S.co);c.end=1;const mine=S;
  S.ce=setTimeout(()=>{if(S!==mine||S.call!==c)return;S.screen=S.callFrom||'home';if(S.screen==='kchat')S.k[S.chat].u=0;S.call=null;S.fk=0;draw()},2000)},
 /* 인스타: 팔로잉 → 팔로우 취소 시트 → 10초 뒤 재현이 카톡 */
 fol(){if(S.fol)S.sheet=1;else{S.fol=true;clearTimeout(S.ut)}},
 sheetx(){S.sheet=0},
 unfol(){S.sheet=0;S.fol=false;
  if(!S.unfDone){const mine=S;clearTimeout(S.ut);S.ut=setTimeout(()=>{if(S===mine&&!S.fol){S.unfDone=1;notify(C.unfollow)}},C.unfollow.delay)}},
 /* 음악 */
 play(){S.play=!S.play},
 prev(){if(S.tr<=0){toast('이전 곡이 없습니다');return false}S.tr--;S.play=true;S.prog=6},
 next(){if(S.tr>=C.playlist.length-1){toast('다음 곡이 없습니다');return false}S.tr++;S.play=true;S.prog=6},
 ndis(){hideNote();return false},
 /* 알림 누르면 해당 카톡 채팅방으로 (통화 중에는 알림만 닫음) */
 note(){hideNote();if(S.call&&!S.call.end)return false;
  const i=S.note;S.k[i].u=0;if(S.screen==='lock'||S.screen==='pin'){S.pend=i;S.screen='pin'}else{S.chat=i;S.screen='kchat'}},
 back(){const x=S.screen;S.sheet=0;
  if(x==='call')return false;
  if(x==='calendar'&&S.cphoto){S.cphoto=0;S.egg=0;return}
  if(x==='chat')S.screen='messages';else if(x==='kchat')S.screen='kakao';else if(x==='kprofile')S.screen='kchat';else if(x==='memoedit')S.screen='memo';
  else if(x==='gallery'&&S.gal!=null)S.gal=null;
  else if(x==='pin'){S.screen='lock';S.pend=null}
  else if(x==='instagram'&&S.ig!=='home')S.ig=S.ig==='dmchat'?'dm':S.ig==='post'?S.pback:'home';
  else if(x!=='lock'&&x!=='home')S.screen='home'}
};
phone.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='toast'){toast(el.dataset.t);return}
  if(ACT[a]){if(ACT[a](el.dataset,el)!==false)draw()}
});
/* 카톡 사진이 늦게 로드되어도 대화창이 맨 아래에 머물도록 */
phone.addEventListener('load',e=>{
  const t=e.target;if(t&&t.classList&&t.classList.contains('kimg')&&S&&S.screen==='kchat'){const c=document.querySelector('#screens .content');if(c)c.scrollTop=c.scrollHeight}
},true);
phone.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.mt!=null)S.memos[+t.dataset.mt].title=t.value;
  else if(t.dataset.mi!=null)S.memos[S.mi].items[+t.dataset.mi].t=t.value;
});
phone.addEventListener('submit',e=>{
  e.preventDefault();
  const q=new FormData(e.target).get('q').trim();
  if(q){S.q=q;draw()}
});
document.addEventListener('keydown',e=>{
  if(!openId)return;
  /* 카톡 입력창: Enter = 전송 */
  if(e.target.id==='kin'){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(ACT.kfree()!==false)draw()}return}
  /* 메모: Enter = 새 항목, 빈 항목에서 Backspace = 항목 삭제 */
  if(S.screen==='memoedit'&&e.target.classList&&e.target.classList.contains('mit')){
    const m=S.memos[S.mi],j=+e.target.dataset.mi;
    if(e.key==='Enter'&&!e.isComposing){e.preventDefault();m.items.splice(j+1,0,{t:'',c:0});S.focus=j+1;draw()}
    else if(e.key==='Backspace'&&e.target.value===''&&!e.isComposing&&m.items.length>1){e.preventDefault();m.items.splice(j,1);S.focus=Math.max(0,j-1);draw()}
    return;
  }
  if(S.screen!=='pin')return;
  if(/^\d$/.test(e.key))ACT.key({n:e.key});else if(e.key==='Backspace')ACT.bksp();else if(e.key==='Enter')ACT.submit();else return;
  draw();
});

/* ===== 폰 열기 + 해시 라우팅 (#phone-ID) ===== */
function openPhone(id){
  if(openId===id)return;
  if(S){['nt','cl','co','ce','ut','hn'].forEach(k=>clearTimeout(S[k]));clearInterval(S.ci)}
  C=CHARS[id];openId=id;t0=Date.now();
  const d=new Date(C.now),[mm,dd]=md(d).split('/').map(Number),yy=+C.now.slice(0,4);
  const memos=C.memos.map(m=>{
    const [h,...r]=m.x.split('\n');
    return {title:h,d:memoDate(m.w),items:r.filter(l=>l.trim()).map(l=>({c:/^\[x\]\s*/i.test(l)?1:0,t:l.replace(/^\[x\]\s*/i,'').replace(/^-\s*/,'')}))};
  });
  S={screen:'lock',pin:'',err:DEF,y:yy,m:mm-1,sel:[yy,mm-1,dd],ig:'home',tab:'recent',dial:'',q:'',chat:0,k:JSON.parse(JSON.stringify(C.kakao)),play:true,pend:null,note:null,mi:0,memos,
     lk:{},pre:{},sv:{},calls:JSON.parse(JSON.stringify(C.calls)),dmi:0,tr:C.start||0,prog:38,focus:null,egg:0,cphoto:0,
     pv:null,pback:'home',pu:null,gal:null,ct:'alarm',al:C.alarms.map(t=>({t,on:true})),call:null,callFrom:null,ci:null,fk:0,fol:true,sheet:0,ut:null,unfDone:0};
  /* 처음부터 좋아요가 눌려 있는 계정(C.autoLike): 홈 게시글 + 프로필 게시물. pre = 기본 좋아요 수에 이미 포함된 좋아요 */
  (C.autoLike||[]).forEach(u=>{
    const on=k=>{S.lk[k]=true;S.pre[k]=true};
    C.posts.forEach((p,i)=>{if(p.u===u)on(i)});
    ((C.profiles&&C.profiles[u]&&C.profiles[u].list)||[]).forEach((x,j)=>on(x.ref!=null?x.ref:'u'+u+j));
  });
  phone.innerHTML=STATUS+'<div id="screens"></div>'+NAV+'<div class="note" id="note" data-a="note"></div><div class="toast" id="toast"></div>';
  draw();
  const mine=S;if(C.notice)S.nt=setTimeout(()=>{if(S===mine)notify(C.notice)},C.notice.delay);
  $('#overlay').classList.add('open');$('#overlay').setAttribute('aria-hidden','false');
  document.body.classList.add('noscroll');
}
function sync(){
  const m=location.hash.match(/^#phone-(.+)$/),id=m&&decodeURIComponent(m[1]);
  openPhone(CHARS[id]?id:Object.keys(CHARS)[0]);
}
addEventListener('hashchange',sync);
sync();
</script>
